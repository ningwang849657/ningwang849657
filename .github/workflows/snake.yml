name: Generate Snake

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 UTC 18:00 重新生成
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成贪吃蛇动画
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#e8935e&color_dots=#ebedf0,#bfd6f6,#8dbdff,#4b91f1,#2b6cb0

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
